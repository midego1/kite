# ZAP baseline rules for the e2e dev server. Format: <rule id> <TAB> <IGNORE|WARN|FAIL> <TAB> (<comment>)
# The scan is report-only (-I); this file only keeps known dev-server artefacts out of the report.
10055	IGNORE	(CSP: the dev server needs 'unsafe-eval' and 'unsafe-inline' for Vite and React; production sends a nonce-based policy)
10054	IGNORE	(Cookie without SameSite: ep_session and ep_accounts are SameSite=Lax, checked by e2e/13-security.spec.ts)
10011	IGNORE	(Cookie without Secure: Secure is set only over https in production; the scan runs over http://localhost)
10035	IGNORE	(Strict-Transport-Security is sent; ZAP flags it over plain http)
