name: Release publish

# A merge to main deploys production through Cloudflare Workers Builds. Once that deploy succeeds,
# tag the deployed commit as v<VERSION> and publish its GitHub release (scripts/deploy/release-publish.mjs).
on:
  check_run:
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release
    if: >-
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      startsWith(github.event.check_run.name, 'Workers Builds: ') &&
      github.event.check_run.conclusion == 'success' &&
      contains(github.event.check_run.details_url, '/production/builds/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default branch, not the deployed commit, is checked out so that only reviewed code
      # runs with a write token; the script reads VERSION and CHANGELOG.md at the deployed commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tag the deployed commit and publish its release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/deploy/release-publish.mjs --event "$GITHUB_EVENT_PATH"
