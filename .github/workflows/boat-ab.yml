# DRAFT — .github/workflows/boat-ab.yml on branch ci/boat-ab (never main).
# A/B: identical steps, only runs-on differs. Push-to-branch trigger only, so it does
# not run on every PR and does not eat Boat start limits ($20 plan: 12/min, 60/h, 200/day).
# One run = 3 runners x 3 jobs = 9 job starts (6 on Boat).
name: Boat A/B

on:
  push:
    branches: [ci/boat-ab]
  workflow_dispatch: # only usable once this file exists on main; until then use `gh run rerun`

concurrency:
  group: boat-ab-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  node-build:
    name: node-build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, boat, boat-large]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          # runner label in the key: no cross-runner cache sharing, so warm/cold is comparable per arm
          key: ab-node-modules-${{ matrix.runner }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}
      - name: Machine info
        run: nproc; free -g; cat /proc/cpuinfo | grep -m1 'model name'
      - name: Build the Node and Docker bundle
        run: npm run quality:timings -- build:node

  mission-validation:
    name: mission-validation (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, boat, boat-large]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ab-node-modules-${{ matrix.runner }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Run the worker validation contract
        run: npm run check:mission
        env:
          MISSION_SKIP_TASKS: build:node,test:e2e

  e2e-full:
    # Fair single-shard compare: every runner runs the same 1/10 of the suite (~7-15 min).
    # The unsharded suite needs 60-90+ min and hit the old 40 min timeout on all arms.
    name: e2e shard 1/10 (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, boat, boat-large]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ab-node-modules-${{ matrix.runner }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # Boat sandboxes may lack Chrome system libs that ubuntu-latest ships: install deps on all arms for fairness.
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Run the end-to-end suite (shard 1/10)
        run: npm run quality:timings -- test:e2e:shard
        env:
          E2E_SHARD: 1/10
