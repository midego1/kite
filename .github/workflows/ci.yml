name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mission-validation:
    name: Mission validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the complete worker validation contract
        run: npm run check:mission
        env:
          MISSION_SKIP_TASKS: build:node
      - name: Summarize timings, flaky tests and coverage
        if: always()
        run: node scripts/quality/ci-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Retain timing, coverage, quality and browser evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mission-validation-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  node-build:
    name: Node build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the Node and Docker bundle
        run: npm run quality:timings -- build:node
      - name: Summarize timings
        if: always()
        run: node scripts/quality/ci-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Retain timing evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: node-build-evidence
          path: test-results/
          retention-days: 14
