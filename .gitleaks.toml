# Gitleaks configuration: the default rules plus reviewed exceptions.
title = "Kite gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Quality debt baseline. Earlier revisions recorded format:<path>:<sha256> content checksums of public source files, which match generic-api-key; the file holds no credentials."
paths = ['''^scripts/quality/baseline\.json$''']

[[allowlists]]
description = "The public label that derives the relay's header signature key from INBOUND_WEBHOOK_SECRET (src/lib/email/inbound-signature.mjs). It is a fixed domain-separation string, not a credential."
regexes = ['''^kite-relay-headers-signature-key-v1$''']
