name: Security scans
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    name: Gitleaks history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan reachable history (redacted output)
        run: "${{ runner.temp }}/gitleaks git --redact=100 --no-banner --exit-code=1 --config .gitleaks.toml --gitleaks-ignore-path .github/gitleaks-ignore ."
  sast:
    name: Offline source security rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned scanner
        run: pipx install semgrep==1.179.0
      - name: Scan runtime source without hosted reporting
        env:
          SEMGREP_SEND_METRICS: "off"
        run: >-
          semgrep scan --config .github/semgrep.yml --metrics=off --disable-version-check
          --error --strict src server worker.ts deploy/cloudflare-email-relay/src
