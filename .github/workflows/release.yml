name: Release draft

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      base:
        description: Comparison ref for the notes (default is the previous v* tag)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag and base
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_INPUT: ${{ inputs.base }}
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          TAG="v$VERSION"
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "$TAG" ]; then
            echo "Tag $REF_NAME does not match VERSION ($TAG)" >&2
            exit 1
          fi
          if [ -n "$BASE_INPUT" ]; then
            BASE="$BASE_INPUT"
          else
            if [ "$EVENT_NAME" = "push" ]; then FROM="$TAG^"; else FROM="HEAD^"; fi
            BASE=$(git describe --tags --abbrev=0 --match 'v*' "$FROM" 2>/dev/null || true)
            if [ -z "$BASE" ]; then
              BASE=$(git rev-list --max-parents=0 HEAD | tail -n 1)
            fi
          fi
          {
            echo "VERSION=$VERSION"
            echo "TAG=$TAG"
            echo "BASE=$BASE"
          } >> "$GITHUB_ENV"

      - name: Render notes
        run: node scripts/release-notes.mjs "$BASE" > notes.md

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release $TAG is already published; leaving it untouched." >&2
              exit 1
            fi
            gh release edit "$TAG" --notes-file notes.md
          else
            VERIFY=()
            if [ "$EVENT_NAME" = "push" ]; then VERIFY=(--verify-tag); fi
            gh release create "$TAG" --draft --title "Kite $VERSION" --notes-file notes.md --target "$GITHUB_SHA" "${VERIFY[@]}"
          fi
