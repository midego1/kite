version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /deploy/cloudflare-email-relay
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # eslint-config-next's react, import and jsx-a11y plugins only declare eslint <= 9.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    groups:
      development-patch-and-minor:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
