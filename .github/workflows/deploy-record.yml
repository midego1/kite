name: Deploy record

on:
  check_run:
    types: [completed]

permissions:
  contents: read
  deployments: write

jobs:
  record:
    name: Record deployment
    if: >-
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      startsWith(github.event.check_run.name, 'Workers Builds: ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Record Cloudflare Workers Builds deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/deploy/deploy-record.mjs --event "$GITHUB_EVENT_PATH"
