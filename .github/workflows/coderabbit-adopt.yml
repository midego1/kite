name: CodeRabbit adopt

# CodeRabbit reviews every pull request. This workflow has Droid verify each of its review
# comments against the code: a comment that holds up becomes a small commit on the pull
# request branch, an incorrect one gets a reply with the reason, and one the code already
# addresses is answered as such. Nothing runs on a local machine; the droid CLI runs
# headless in CI with the FACTORY_API_KEY repository secret (a Factory API key).
#
# Two jobs, so pull-request code never runs where write credentials live:
#   adopt    - read-only: resolves and collects the comments, then Droid verifies, fixes,
#              validates and commits locally (no GitHub token, no push access).
#   publish  - write-only: applies the patch, pushes it, and answers every comment. It runs
#              no project code at all.
#
# Off switch without touching code: Settings → Secrets and variables → Actions → Variables →
# CODERABBIT_ADOPT = off. For one pull request by hand: Actions → CodeRabbit adopt →
# Run workflow → number.

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      number:
        description: "Pull request number"
        required: true

permissions: {}

concurrency:
  group: coderabbit-adopt-${{ github.event.pull_request.number || inputs.number }}
  cancel-in-progress: true

jobs:
  adopt:
    name: Verify CodeRabbit comments (read-only)
    # Only CodeRabbit's own reviews start it (the bot's replies and commits never do);
    # a manual dispatch works on any pull request.
    if: >-
      vars.CODERABBIT_ADOPT != 'off' &&
      (github.event_name == 'workflow_dispatch' || github.actor == 'coderabbitai[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
      skipped: ${{ steps.pr.outputs.skipped }}
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || inputs.number }}
        run: |
          gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json number,headRefName,headRefOid,isCrossRepository > "$RUNNER_TEMP/pr.json"
          if [ "$(jq -r .isCrossRepository "$RUNNER_TEMP/pr.json")" = "true" ]; then
            echo "Skipped: this pull request comes from a fork, and the workflow only adopts comments on same-repo branches." >> "$GITHUB_STEP_SUMMARY"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r '"number=\(.number)\nsha=\(.headRefOid)"' "$RUNNER_TEMP/pr.json" >> "$GITHUB_OUTPUT"
      # The collector lives in this repository, so the checkout comes first. The token is
      # read-only and the credential is not persisted, like the PR report's report job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.pr.outputs.skipped != 'true'
        with:
          ref: ${{ steps.pr.outputs.sha }}
          # This job verifies and commits only; the publish job holds the write credentials.
          persist-credentials: false
      - name: Collect the unhandled CodeRabbit comments
        id: comments
        if: steps.pr.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          node scripts/review/coderabbit-comments.mjs > "$RUNNER_TEMP/comments.json"
          echo "count=$(jq '.comments | length' "$RUNNER_TEMP/comments.json")" >> "$GITHUB_OUTPUT"
          jq -r '"Pull request #\(.pullRequest): \(.comments | length) comment(s) to handle"' "$RUNNER_TEMP/comments.json" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.comments[] | "- #\(.id) \(.path):\(.line)"' "$RUNNER_TEMP/comments.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.comments.outputs.count && steps.comments.outputs.count != '0'
        with:
          node-version: 22
      # Caches are only restored here and saved by the CI jobs that run clean installs, so
      # a pull request branch can never write a cache that the default branch later restores.
      - name: Restore node_modules
        if: steps.comments.outputs.count && steps.comments.outputs.count != '0'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      # The Playwright browser, for comments whose fix needs an e2e spec.
      - name: Restore the Playwright browser
        if: steps.comments.outputs.count && steps.comments.outputs.count != '0'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install droid
        if: steps.comments.outputs.count && steps.comments.outputs.count != '0'
        run: npm install --global droid@0.241.1
      - name: Verify the comments and commit the adoptions
        if: steps.comments.outputs.count && steps.comments.outputs.count != '0'
        timeout-minutes: 20
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if [ -z "${FACTORY_API_KEY:-}" ]; then
            echo "Set the FACTORY_API_KEY repository secret (a Factory API key); without it Droid cannot run." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # A fresh runner has no git identity and Droid commits the adoptions.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/comments.json" comments.json
          # No GitHub token here and --auto medium: Droid can fix, validate and commit, but
          # it cannot push or answer anything, so pull-request test code never runs with
          # write credentials.
          droid exec --auto medium --tag coderabbit-adopt -f scripts/review/coderabbit-adopt-prompt.md
      - name: Pack the adoptions and the replies
        if: steps.comments.outputs.count && steps.comments.outputs.count != '0'
        env:
          BASE_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          git format-patch "$BASE_SHA" --stdout > "$RUNNER_TEMP/adoptions.patch"
          if [ -f replies.json ]; then
            cp replies.json "$RUNNER_TEMP/replies.json"
          else
            printf '[]' > "$RUNNER_TEMP/replies.json"
          fi
      - name: Hand the adoptions to the publish job
        if: steps.comments.outputs.count && steps.comments.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coderabbit-adopt
          path: |
            ${{ runner.temp }}/adoptions.patch
            ${{ runner.temp }}/replies.json
          retention-days: 1

  publish:
    name: Push the adoptions and answer the comments
    needs: adopt
    if: needs.adopt.result == 'success' && needs.adopt.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the adopted commits
      pull-requests: write # reply on every comment
    steps:
      - name: Resolve the pull request branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.adopt.outputs.number }}
          ADOPTED_SHA: ${{ needs.adopt.outputs.sha }}
        run: |
          gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName,headRefOid > "$RUNNER_TEMP/pr.json"
          # A push during the adopt job would make the patch apply to a different base.
          if [ "$(jq -r .headRefOid "$RUNNER_TEMP/pr.json")" != "$ADOPTED_SHA" ]; then
            echo "The branch moved after the comments were verified; rerun the workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          jq -r '"branch=\(.headRefName)"' "$RUNNER_TEMP/pr.json" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          # The push below is the only place a write credential appears, and this job runs
          # no project code.
          persist-credentials: false
      # After the checkout, which cleans the workspace, so the patch and the replies survive.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coderabbit-adopt
      - name: Apply the adoptions and push them
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -s adoptions.patch ]; then
            # A fresh runner has no git identity and git am needs a committer.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git am adoptions.patch
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${PR_BRANCH}"
            echo "pushed=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "Pushed the adopted commits to ${PR_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to adopt." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Answer every comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.adopt.outputs.number }}
          BEFORE: ${{ steps.push.outputs.before }}
        run: |
          answer() {
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments/$1/replies" -f body="$2"
          }
          # Adopted comments: the commit that adopted them carries their id in its body.
          if [ -n "${{ steps.push.outputs.pushed }}" ]; then
            for sha in $(git rev-list "${BEFORE}"..HEAD); do
              id=$(git log -1 --format=%B "$sha" | grep -o 'Addresses CodeRabbit review comment [0-9]*' | grep -o '[0-9]*' | head -n1)
              if [ -n "$id" ]; then
                answer "$id" "Adopted in ${sha:0:7}."
              fi
            done
          fi
          count=$(jq 'length' replies.json)
          for index in $(seq 0 $((count - 1))); do
            id=$(jq -r ".[${index}].commentId" replies.json)
            body=$(jq -r ".[${index}].body" replies.json)
            answer "$id" "$body"
          done
          echo "Answered every comment." >> "$GITHUB_STEP_SUMMARY"
